<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagangHub Auto-Log</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo-badge">MH</div>
      <div>
        <h1 class="title">Auto-Log MagangHub</h1>
        <p class="subtitle">Bertenaga AI (1-Click Auto Fill)</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Pengaturan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Notice Bar -->
    <div id="noticeBar" class="notice-bar" hidden></div>

    <!-- Quick Chips / Presets -->
    <div class="chips-container">
      <span class="chips-label">Preset Cepat:</span>
      <div class="chips-list">
        <button class="chip" data-text="Fixing bug dan debugging issue pada modul backend">🐞 Bug Fix</button>
        <button class="chip" data-text="Implementasi fitur baru dan slicing tampilan">✨ Fitur Baru</button>
        <button class="chip" data-text="Melakukan integrasi API dan testing endpoint">🔌 Integrasi API</button>
        <button class="chip" data-text="Code review bersama tim dan refactoring">🔍 Code Review</button>
        <button class="chip" data-text="Mengikuti daily standup meeting dan koordinasi progres">🗣️ Daily Standup</button>
        <button class="chip" data-text="Membuat unit test dan automated integration testing">🧪 Testing</button>
      </div>
    </div>

    <!-- Input Box -->
    <div class="form-group">
      <label for="kegiatanInput" class="form-label">Kegiatan Singkat Hari Ini</label>
      <textarea id="kegiatanInput" rows="3" placeholder="Contoh: Optimasi query SQL dan perbaikan endpoint login"></textarea>
      <div class="input-hint">Tekan <strong>Ctrl + Enter</strong> untuk langsung generate & isi form.</div>
    </div>

    <!-- Action Button (1-Click Action) -->
    <button id="actionBtn" class="btn btn-primary">
      <span class="btn-icon">⚡</span>
      <span id="actionBtnText">Generate & Langsung Isi Form</span>
    </button>

    <!-- Status Message -->
    <div id="statusBox" class="status-box" hidden></div>
  </main>

  <footer class="app-footer">
    <span id="tabStatus">Mendeteksi tab MagangHub...</span>
  </footer>

  <script src="gemini.js"></script>
  <script src="fill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
